name: 发布 WordPress 插件

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包插件
        run: |
          mkdir -p dist/webp-sibling-replacer
          cp -R webp-sibling-replacer.php readme.txt lib includes dist/webp-sibling-replacer/
          cd dist && zip -r webp-sibling-replacer.zip webp-sibling-replacer
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/webp-sibling-replacer.zip
